<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a9ea3"/>
      <stop offset="1" stop-color="#5d6065"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3c7cc"/>
      <stop offset="1" stop-color="#2c2e31"/>
    </linearGradient>
    <radialGradient id="head" cx="0.36" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffc08a"/>
      <stop offset="0.55" stop-color="#f07a2a"/>
      <stop offset="1" stop-color="#7a3208"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <!-- the panel -->
  <rect x="12" y="12" width="232" height="232" rx="44" fill="url(#rim)"/>
  <rect x="15" y="15" width="226" height="226" rx="41" fill="url(#case)"/>
  <!-- shadows on the panel -->
  <g fill="none" stroke="#000" stroke-opacity="0.35" stroke-linecap="round" filter="url(#soft)" transform="translate(4 6)">
    <path d="M96 60 H134 A40 37 0 0 1 134 134 H96" stroke-width="16"/>
    <path d="M96 60 V196" stroke-width="30"/>
  </g>
  <!-- the bowl of the P: a blue cord, a c turned round, its ends behind the stem -->
  <g fill="none" stroke-linecap="round">
    <path d="M96 60 H134 A40 37 0 0 1 134 134 H96" stroke="#14244d" stroke-width="22"/>
    <path d="M96 60 H134 A40 37 0 0 1 134 134 H96" stroke="#4f7be0" stroke-width="16"/>
    <path d="M100 55 H134 A35 32 0 0 1 166 92" stroke="#a9c1ff" stroke-width="4" opacity="0.7"/>
  </g>
  <!-- the stem: an orange cord between two plugs -->
  <g fill="none" stroke-linecap="round">
    <path d="M96 60 V196" stroke="#4a1e05" stroke-width="22"/>
    <path d="M96 60 V196" stroke="#f07a2a" stroke-width="16"/>
    <path d="M91 70 V186" stroke="#ffb27a" stroke-width="4" opacity="0.7"/>
  </g>
  <!-- the two plugs -->
  <g>
    <circle cx="96" cy="60" r="19" fill="#3d1803"/>
    <circle cx="96" cy="60" r="17.5" fill="url(#head)"/>
    <circle cx="96" cy="60" r="11" fill="none" stroke="#000" stroke-opacity="0.18" stroke-width="1.5"/>
    <ellipse cx="89.5" cy="52.5" rx="6" ry="3" transform="rotate(-40 89.5 52.5)" fill="#fff" opacity="0.55"/>
  </g>
  <g>
    <circle cx="96" cy="196" r="19" fill="#3d1803"/>
    <circle cx="96" cy="196" r="17.5" fill="url(#head)"/>
    <circle cx="96" cy="196" r="11" fill="none" stroke="#000" stroke-opacity="0.18" stroke-width="1.5"/>
    <ellipse cx="89.5" cy="188.5" rx="6" ry="3" transform="rotate(-40 89.5 188.5)" fill="#fff" opacity="0.55"/>
  </g>
</svg>
