<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a9ea3"/>
      <stop offset="1" stop-color="#5d6065"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3c7cc"/>
      <stop offset="1" stop-color="#2c2e31"/>
    </linearGradient>
    <linearGradient id="nut" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f5f6"/>
      <stop offset="0.55" stop-color="#b3b6ba"/>
      <stop offset="1" stop-color="#6c6f73"/>
    </linearGradient>
    <radialGradient id="chrome" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#b9bcc1"/>
      <stop offset="0.75" stop-color="#65686d"/>
      <stop offset="1" stop-color="#a6a9ad"/>
    </radialGradient>
    <radialGradient id="head" cx="0.36" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffc08a"/>
      <stop offset="0.55" stop-color="#f07a2a"/>
      <stop offset="1" stop-color="#7a3208"/>
    </radialGradient>
    <linearGradient id="barrel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55585c"/>
      <stop offset="0.45" stop-color="#c6c9cd"/>
      <stop offset="1" stop-color="#505357"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <!-- the panel -->
  <rect x="12" y="12" width="232" height="232" rx="44" fill="url(#rim)"/>
  <rect x="15" y="15" width="226" height="226" rx="41" fill="url(#case)"/>
  <!-- shadows of the cord and the plugs on the panel -->
  <g fill="none" stroke="#000" stroke-opacity="0.35" stroke-linecap="round" filter="url(#soft)" transform="translate(6 9)">
    <path d="M78 116 C70 236, 186 236, 178 116" stroke-width="20"/>
    <path d="M78 79 V120 M178 79 V120" stroke-width="44"/>
  </g>
  <!-- the cord between the two plugs: an outline, the colour, a highlight -->
  <g fill="none" stroke-linecap="round">
    <path d="M78 116 C70 236, 186 236, 178 116" stroke="#4a1e05" stroke-width="22"/>
    <path d="M78 116 C70 236, 186 236, 178 116" stroke="#f07a2a" stroke-width="16"/>
    <path d="M74 122 C68 226, 182 228, 175 124" stroke="#ffb27a" stroke-width="4" opacity="0.7"/>
  </g>
  <!-- left: a seated plug; its metal barrel runs down to the cord -->
  <g>
    <polygon points="78,48 105,63.5 105,94.5 78,110 51,94.5 51,63.5" fill="url(#nut)" stroke="#43454a" stroke-width="2"/>
    <rect x="68" y="80" width="20" height="44" rx="3" fill="url(#barrel)"/>
    <circle cx="78" cy="79" r="25" fill="#3d1803"/>
    <circle cx="78" cy="79" r="23" fill="url(#head)"/>
    <circle cx="78" cy="79" r="15" fill="none" stroke="#000" stroke-opacity="0.18" stroke-width="2"/>
    <ellipse cx="69" cy="69" rx="8" ry="4" transform="rotate(-40 69 69)" fill="#fff" opacity="0.55"/>
  </g>
  <!-- right: the same -->
  <g>
    <polygon points="178,48 205,63.5 205,94.5 178,110 151,94.5 151,63.5" fill="url(#nut)" stroke="#43454a" stroke-width="2"/>
    <rect x="168" y="80" width="20" height="44" rx="3" fill="url(#barrel)"/>
    <circle cx="178" cy="79" r="25" fill="#3d1803"/>
    <circle cx="178" cy="79" r="23" fill="url(#head)"/>
    <circle cx="178" cy="79" r="15" fill="none" stroke="#000" stroke-opacity="0.18" stroke-width="2"/>
    <ellipse cx="169" cy="69" rx="8" ry="4" transform="rotate(-40 169 69)" fill="#fff" opacity="0.55"/>
  </g>
</svg>
