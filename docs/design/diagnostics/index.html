<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Patchcord · DIAGNOSTICS, a new look</title>
<!--
  ENGINE's DIAGNOSTICS (the tables under the graph) in three looks, on SERVER and the tab row, with
  this machine's numbers. Pick one with the keys at the top; hover a value: what it is goes to the
  status bar (it is no longer a column). Click the tab keys: only SERVER is drawn, the rest say so.
    A · an instrument panel: the top panel's painted metal, amber LCD windows, a printed name over
        each; the tabs are keys with a light, as LAYOUT's on the panel
    B · a quiet console: dark, no table: cards of a name and a big value; the tabs a segmented row
    C · a unit in the rack: DIAGNOSTICS as a device of its own, ears and screws, its name plate
        and keys on the left, its screens on the right
-->
<style>
  @font-face { font-family: "Noto Sans"; font-weight: 700; src: url(../../../assets/fonts/NotoSans-Bold.ttf); }
  @font-face { font-family: "Noto Sans Mono"; font-weight: 400; src: url(../../../assets/fonts/NotoSansMono-Regular.ttf); }
  @font-face { font-family: "Noto Sans Mono"; font-weight: 700; src: url(../../../assets/fonts/NotoSansMono-Bold.ttf); }
  :root { --lcd: linear-gradient(#f7bb62, #e58f2c); --lcdink: #3a2408; --metal: linear-gradient(#a3a6aa, #8c8e91 55%, #85878a); }
  html, body { margin: 0; background: #141516; color: #c9cbcd; font-family: "Noto Sans", sans-serif; }
  header { padding: 14px 20px 6px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  header h1 { margin: 0 14px 0 0; font-size: 18px; letter-spacing: 2px; color: #e58f2c; }
  header button { background: #26282b; color: #c9cbcd; border: 1px solid #3a3c40; border-radius: 4px; padding: 6px 12px; font: 700 11px "Noto Sans"; letter-spacing: .6px; cursor: pointer; }
  header button.on { border-color: #e58f2c; color: #e58f2c; }
  #what { padding: 0 20px 10px; color: #8d9095; font-size: 13px; max-width: 1100px; }
  /* the window: the graph's last rows, then DIAGNOSTICS, then the status bar */
  .win { margin: 0 20px 30px; border: 1px solid #000; border-radius: 6px; overflow: hidden; background: #1b1c1e; }
  .graph { height: 90px; background: #1b1c1e; position: relative; border-bottom: 1px solid #000; }
  .graph .blk { position: absolute; top: -30px; width: 244px; height: 90px; border: 1.5px solid #007c7d; border-radius: 6px; background: #1d1e21; opacity: .8; }
  .status { height: 24px; background: #0e0f10; border-top: 1px solid #000; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font: 12px "Noto Sans Mono"; color: #7d8085; }
  .status b { color: #c9cbcd; font-weight: 400; }
  .diag { min-height: 230px; }
  .other { padding: 30px; font: 12px "Noto Sans Mono"; color: #7d8085; }
  .hov { cursor: default; }

  /* ---------- A · an instrument panel ---------- */
  .A { background: var(--metal); border-top: 1px solid #c8cacd; padding: 10px 18px 16px; }
  .A .keys { display: flex; align-items: flex-end; gap: 8px; margin-bottom: 14px; }
  .A .key { position: relative; height: 30px; padding: 0 16px 0 24px; display: flex; align-items: center; background: linear-gradient(#2a2b2e, #151618); border: 1px solid #000;
    border-radius: 5px; color: #e6e7e8; font: 700 10.5px "Noto Sans"; letter-spacing: .7px; box-shadow: 0 2px 0 #0008, inset 0 1px 0 #ffffff22; cursor: pointer; }
  .A .key::before { content: ""; position: absolute; left: 9px; top: 7px; width: 6px; height: 6px; border-radius: 50%; background: #3a1512; }
  .A .key.on::before { background: #ff4a32; box-shadow: 0 0 0 1px #0006; }
  .A .key .n { color: #ffb02e; margin-left: 6px; }
  .A .grouplabel { font: 700 9px "Noto Sans"; letter-spacing: 1.4px; color: #2a2b2d; text-align: center; margin-top: 3px; }
  .A .report { margin-left: auto; }
  .A .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-start; }
  .A .cell { display: flex; flex-direction: column; gap: 4px; }
  .A .cell label { font: 700 9px "Noto Sans"; letter-spacing: 1.4px; color: #1d1e20; padding-left: 2px; }
  .A .lcd { background: #0c0c0d; border-radius: 5px; padding: 3px; box-shadow: inset 0 1px 0 #0008, 0 1px 0 #ffffff44; }
  .A .lcd > div { background: var(--lcd); border-radius: 3px; height: 34px; padding: 0 12px; display: flex; align-items: center; gap: 12px;
    font: 700 15px "Noto Sans Mono"; color: var(--lcdink); white-space: nowrap; }
  .A .lcd small { font: 400 11px "Noto Sans Mono"; opacity: .75; }
  .A .lcd svg { display: block; }
  .A .lamps { display: flex; gap: 16px; align-items: center; height: 40px; padding: 0 4px; }
  .A .lamp { display: flex; align-items: center; gap: 7px; font: 700 13px "Noto Sans Mono"; color: #1d1e20; }
  .A .lamp i { width: 11px; height: 11px; border-radius: 50%; border: 1px solid #0007; display: inline-block; }

  /* ---------- B · a quiet console ---------- */
  .B { background: #17181a; padding: 12px 18px 18px; }
  .B .keys { display: flex; gap: 0; margin-bottom: 16px; align-items: center; }
  .B .seg { display: flex; background: #0e0f10; border: 1px solid #000; border-radius: 6px; padding: 3px; gap: 2px; }
  .B .seg span { padding: 6px 14px; border-radius: 4px; font: 700 10.5px "Noto Sans"; letter-spacing: .7px; color: #8d9095; cursor: pointer; }
  .B .seg span.on { background: #2e3034; color: #f3efe6; box-shadow: inset 0 -2px 0 #e58f2c; }
  .B .seg .n { color: #ffb02e; margin-left: 5px; }
  .B .report { margin-left: auto; background: #262729; border: 1px solid #070708; border-radius: 4px; padding: 6px 14px; font: 700 10.5px "Noto Sans"; letter-spacing: .5px; color: #e6e7e8; }
  .B .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .B .card { background: #1f2023; border: 1px solid #26282b; border-radius: 6px; padding: 10px 12px 12px; }
  .B .card.wide { grid-column: span 2; }
  .B .card label { display: block; font: 700 9px "Noto Sans"; letter-spacing: 1.3px; color: #7d8085; margin-bottom: 6px; }
  .B .card div { font: 700 18px "Noto Sans Mono"; color: #f3efe6; white-space: nowrap; display: flex; align-items: center; gap: 12px; }
  .B .card small { font: 400 11px "Noto Sans Mono"; color: #8d9095; }

  /* ---------- C · a unit in the rack ---------- */
  .C { background: #101112; padding: 14px 0 16px; }
  .C .unit { position: relative; margin: 0 26px; background: linear-gradient(#c3c6ca, #b5b8bc); border-radius: 3px; border: 1px solid #000; padding: 14px 40px 14px 40px; display: flex; gap: 22px; align-items: flex-start; }
  .C .screw { position: absolute; width: 11px; height: 11px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #e4e6e8, #7d8084); border: 1px solid #333; }
  .C .screw::after { content: ""; position: absolute; left: 1px; right: 1px; top: 4.5px; height: 1.5px; background: #333; }
  .C .plate { width: 230px; flex: none; }
  .C .plate h3 { margin: 0 0 6px; font: 700 15px "Noto Sans"; letter-spacing: 1.2px; color: #1d1e20; }
  .C .plate p { margin: 0 0 10px; font: 700 9px "Noto Sans"; letter-spacing: 1.2px; color: #4a4d52; }
  .C .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .C .key { position: relative; height: 24px; display: flex; align-items: center; justify-content: center; background: linear-gradient(#2a2b2e, #151618); border: 1px solid #000; border-radius: 4px;
    color: #e6e7e8; font: 700 9px "Noto Sans"; letter-spacing: .5px; box-shadow: 0 2px 0 #0007; cursor: pointer; }
  .C .key.on { box-shadow: 0 2px 0 #0007, inset 0 0 0 1.5px #e58f2c; }
  .C .key .n { color: #ffb02e; margin-left: 4px; }
  .C .report { grid-column: span 3; margin-top: 4px; }
  .C .screens { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .C .scr { background: #0c0c0d; border-radius: 5px; padding: 3px; }
  .C .scr.wide { grid-column: span 2; }
  .C .scr > div { background: var(--lcd); border-radius: 3px; padding: 5px 10px 7px; color: var(--lcdink); }
  .C .scr label { display: block; font: 700 8.5px "Noto Sans Mono"; letter-spacing: 1.2px; opacity: .65; }
  .C .scr b { display: flex; align-items: center; gap: 10px; font: 700 15px "Noto Sans Mono"; white-space: nowrap; }
  .C .scr small { font: 400 11px "Noto Sans Mono"; opacity: .75; }
</style>
</head>
<body>
<header>
  <h1>DIAGNOSTICS</h1>
  <button data-v="A">A · INSTRUMENT PANEL</button>
  <button data-v="B">B · QUIET CONSOLE</button>
  <button data-v="C">C · A UNIT IN THE RACK</button>
</header>
<div id="what"></div>
<div class="win">
  <div class="graph"><div class="blk" style="left:60px"></div><div class="blk" style="left:420px;border-color:#695ca6"></div><div class="blk" style="left:780px;border-color:#427935"></div></div>
  <div class="diag" id="diag"></div>
  <div class="status"><span>ENGINE · what PipeWire really has · 13 nodes · 29 ports · 7 links</span><b id="hint">hover a value: what it is</b></div>
</div>
<script>
"use strict";
// SERVER's values (this machine's), and what each is: the status bar says it on hover
const ROWS = [
  ["CLOCK", "48000 Hz", "", "the sample rate the graph runs at (clock.rate)"],
  ["QUANTUM", "1024", "32–2048", "samples a cycle, and the least and most it may be: larger is safer, smaller is quicker"],
  ["DSP LOAD", "1.7%", "", "how much of its cycle the busiest driver spends working; the curve: the last 45 seconds"],
  ["XRUNS", "0", "", "cycles missed since ENGINE opened: a click or a gap in the sound"],
  ["DRIVERS", "1", "running", "devices (or the dummy driver) that clock a group of nodes: see TOP"],
  ["SERVER", "PipeWire 1.6.9", "", "the PipeWire this runs on"],
  ["SESSION", "WirePlumber", "", "the session manager: what links new streams and keeps settings"],
  ["ALLOWED", "48000", "", "rates the clock may switch to (clock.allowed-rates)"],
  ["OBJECTS", "111", "13 nodes · 29 ports · 7 links", "everything PipeWire lists: see OBJECTS"],
];
const HEALTH = "errors and warnings found: see ISSUES";
const TABS = [["SERVER"], ["TOP"], ["ISSUES", "0"], ["OBJECTS"], ["METADATA"], ["EVENTS"]];
let load = Array.from({ length: 70 }, (_, i) => 0.012 + 0.006 * Math.abs(Math.sin(i * 1.7)) + (i % 9 === 0 ? 0.01 : 0));
function curve(w, h, ink) {
  const top = Math.max(...load) * 1.2, step = w / 89;
  const pts = load.map((v, i) => `${(i * step).toFixed(1)},${(h - (v / top) * h).toFixed(1)}`).join(" ");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${ink}" stroke-width="1.4"/></svg>`;
}
const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;");
let v = "A", tab = "SERVER";
const WHAT = {
  A: "An instrument panel: the top panel's painted metal, a printed name over each amber LCD window, the tabs keys with a light (as LAYOUT's). What a value is goes to the status bar on hover, not a column.",
  B: "A quiet console: dark as now, but no table: a card a value, its name small over it, the value big. The tabs a segmented row. What it is: on hover, in the status bar.",
  C: "A unit in the rack: DIAGNOSTICS is a device of its own, as the rack's: its plate with its name and keys on the left (the tabs, SAVE REPORT), its screens on the right.",
};
function A() {
  const keys = TABS.map(([t, n]) => `<div class="key ${t === tab ? "on" : ""}" data-t="${t}">${t}${n !== undefined ? `<span class="n">${n}</span>` : ""}</div>`).join("");
  const cell = ([k, val, sub, what], wide) => `<div class="cell hov" data-w="${esc(what)}"><label>${k}</label><div class="lcd"><div>${esc(val)}${sub ? `<small>${esc(sub)}</small>` : ""}${wide ? curve(260, 24, "#3a2408") : ""}</div></div></div>`;
  const body = tab !== "SERVER" ? `<div class="other" style="color:#1d1e20">${tab}: as SERVER, in this look</div>` : `<div class="row">
    ${cell(ROWS[0])}${cell(ROWS[1])}${cell(ROWS[2], true)}${cell(ROWS[3])}
    <div class="cell hov" data-w="${HEALTH}"><label>HEALTH</label><div class="lamps"><span class="lamp"><i style="background:#3a1512"></i>0 ERRORS</span><span class="lamp"><i style="background:#3d2a0a"></i>0 WARNINGS</span></div></div>
  </div><div class="row" style="margin-top:12px">${cell(ROWS[4])}${cell(ROWS[5])}${cell(ROWS[6])}${cell(ROWS[7])}${cell(ROWS[8])}</div>`;
  return `<div class="A"><div class="keys">${keys}<div class="key report" style="padding-left:16px">SAVE REPORT</div></div>${body}</div>`;
}
function B() {
  const keys = `<div class="seg">${TABS.map(([t, n]) => `<span class="${t === tab ? "on" : ""}" data-t="${t}">${t}${n !== undefined ? `<span class="n">${n}</span>` : ""}</span>`).join("")}</div><div class="report">SAVE REPORT</div>`;
  const card = ([k, val, sub, what], wide) => `<div class="card hov ${wide ? "wide" : ""}" data-w="${esc(what)}"><label>${k}</label><div>${esc(val)}${sub ? `<small>${esc(sub)}</small>` : ""}${wide ? curve(200, 26, "#e58f2c") : ""}</div></div>`;
  const body = tab !== "SERVER" ? `<div class="other">${tab}: as SERVER, in this look</div>` : `<div class="grid">
    ${card(ROWS[0])}${card(ROWS[1])}${card(ROWS[2], true)}${card(ROWS[3])}
    <div class="card hov" data-w="${HEALTH}"><label>HEALTH</label><div><span style="color:#ff5a42">0</span><small>ERRORS</small><span style="color:#ffb02e">0</span><small>WARNINGS</small></div></div>
    ${ROWS.slice(4).map((r) => card(r)).join("")}</div>`;
  return `<div class="B"><div class="keys">${keys}</div>${body}</div>`;
}
function C() {
  const keys = TABS.map(([t, n]) => `<div class="key ${t === tab ? "on" : ""}" data-t="${t}">${t}${n !== undefined ? `<span class="n">${n}</span>` : ""}</div>`).join("");
  const scr = ([k, val, sub, what], wide) => `<div class="scr hov ${wide ? "wide" : ""}" data-w="${esc(what)}"><div><label>${k}</label><b>${esc(val)}${sub ? `<small>${esc(sub)}</small>` : ""}${wide ? curve(190, 20, "#3a2408") : ""}</b></div></div>`;
  const body = tab !== "SERVER" ? `<div class="other" style="color:#1d1e20">${tab}: as SERVER, in this look</div>` : `<div class="screens">
    ${scr(ROWS[0])}${scr(ROWS[1])}${scr(ROWS[2], true)}${scr(ROWS[3])}
    <div class="scr hov" data-w="${HEALTH}"><div><label>HEALTH</label><b><span>0</span><small>ERRORS</small><span>0</span><small>WARNINGS</small></b></div></div>
    ${ROWS.slice(4).map((r) => scr(r)).join("")}</div>`;
  const screws = [[8, 8], [8, "calc(100% - 20px)"], ["calc(100% - 20px)", 8], ["calc(100% - 20px)", "calc(100% - 20px)"]]
    .map(([x, y]) => `<span class="screw" style="left:${typeof x === "number" ? x + "px" : x};top:${typeof y === "number" ? y + "px" : y}"></span>`).join("");
  return `<div class="C"><div class="unit">${screws}<div class="plate"><h3>DIAGNOSTICS</h3><p>PIPEWIRE 1.6.9 · 48 kHz · 1024</p><div class="keys">${keys}<div class="key report">SAVE REPORT</div></div></div>${body}</div></div>`;
}
function draw() {
  document.querySelectorAll("header button").forEach((b) => b.classList.toggle("on", b.dataset.v === v));
  document.getElementById("what").textContent = WHAT[v];
  const d = document.getElementById("diag");
  d.innerHTML = { A, B, C }[v]();
  d.querySelectorAll("[data-t]").forEach((k) => (k.onclick = () => { tab = k.dataset.t; draw(); }));
  d.querySelectorAll(".hov").forEach((el) => {
    el.onmouseenter = () => (document.getElementById("hint").textContent = el.dataset.w);
    el.onmouseleave = () => (document.getElementById("hint").textContent = "hover a value: what it is");
  });
}
document.querySelectorAll("header button").forEach((b) => (b.onclick = () => { v = b.dataset.v; draw(); }));
setInterval(() => { load.push(0.012 + Math.random() * 0.01); if (load.length > 90) load.shift(); if (tab === "SERVER") { const h = document.getElementById("hint").textContent; draw(); document.getElementById("hint").textContent = h; } }, 500);
draw();
</script>
</body>
</html>
