reserve">error: no common format</text><text x="206.0" y="154.0" font-family="Noto Sans" font-size="10" fill="#7d8085" text-anchor="start" xml:space="preserve">in the colour they come from</text><text x="206.0" y="180.0" font-family="Noto Sans Mono" font-size="9" fill="#8a8d91" font-weight="bold" text-anchor="start" letter-spacing="1.6" xml:space="preserve">GROUPS</text><path d="M206,186 H396" stroke="#2c2d31"/><text x="206.0" y="204.0" font-family="Noto Sans" font-size="8.5" fill="#e58f2c" font-weight="bold" text-anchor="start" letter-spacing="0.5" xml:space="preserve">NOT RUNNING</text><text x="317.6" y="204.0" font-family="Noto Sans" font-size="10.5" fill="#c9cbcd" text-anchor="start" xml:space="preserve">no clock now</text><text x="206.0" y="222.0" font-family="Noto Sans" font-size="8.5" fill="#e58f2c" font-weight="bold" text-anchor="start" letter-spacing="0.5" xml:space="preserve">INTERNAL DRIVERS</text><text x="317.6" y="222.0" font-family="Noto Sans" font-size="10.5" fill="#c9cbcd" text-anchor="start" xml:space="preserve">PipeWire's own</text><text x="412.0" y="54.0" font-family="Noto Sans Mono" font-size="9" fill="#8a8d91" font-weight="bold" text-anchor="start" letter-spacing="1.6" xml:space="preserve">TAGS</text><path d="M412,60 H624" stroke="#2c2d31"/><text x="412.0" y="78.0" font-family="Noto Sans" font-size="8.5" fill="#e58f2c" font-weight="bold" text-anchor="start" letter-spacing="0.5" xml:space="preserve">DRIVER</text><text x="511.4" y="78.0" font-family="Noto Sans" font-size="10.5" fill="#c9cbcd" text-anchor="start" xml:space="preserve">clocks its group</text><text x="412.0" y="96.0" font-family="Noto Sans" font-size="8.5" fill="#e58f2c" font-weight="bold" text-anchor="start" letter-spacing="0.5" xml:space="preserve">SYSTEM</text><text x="511.4" y="96.0" font-family="Noto Sans" font-size="10.5" fill="#c9cbcd" text-anchor="start" xml:space="preserve">WirePlumber's own</text><text x="412.0" y="114.0" font-family="Noto Sans" font-size="8.5" fill="#e58f2c