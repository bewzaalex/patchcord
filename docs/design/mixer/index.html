<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patchcord Mixer</title>
<!--
  MIXER as the code draws it (src/ui/mixer.rs, ADR 0015), to fine-tune its look here first.
  Everything on the console is drawn the way `module_svg`, `push_key`, `key`, `led_key`,
  `cap_svg` and `leds_svg` draw it, with the same measures (LEFT, TOP, HEAD, STRIP_W, ROUTE_Y,
  the rows, KEYS_Y, CHAN_Y, TRAVEL, LEDS, STRIP_H), the same type
  (SECTION 9 px / 1.2, SMALL 7.5 px / 0.8, Noto Sans Bold from assets/fonts) and the same paints
  (`face::fin`, the textures and the sheen of `face::raster`). One CSS pixel is one of the app's
  logical pixels. The top panel is the app's own, drawn by it at 1440 wide
  (PATCHCORD_MIXER_PANEL=docs/design/mixer/panel.png cargo test mixer_panel -- --ignored).
  The graph is the maintainer's of 2026-11-24. Keep this in step with mixer.rs: a change to the
  look is tried here, then made there.
-->
<style>
  @font-face { font-family: "Noto Sans"; font-weight: 700; src: url(../../../assets/fonts/NotoSans-Bold.ttf); }
  @font-face { font-family: "Noto Sans"; font-weight: 900; src: url(../../../assets/fonts/NotoSans-Black.ttf); }
  @font-face { font-family: "Noto Sans Mono"; font-weight: 400; src: url(../../../assets/fonts/NotoSansMono-Regular.ttf); }
  @font-face { font-family: "Noto Sans Mono"; font-weight: 700; src: url(../../../assets/fonts/NotoSansMono-Bold.ttf); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #151618; }
  body { display: flex; flex-direction: column; user-select: none; font-family: "Noto Sans", sans-serif; }
  /* the top panel: the app's own picture; past it, its bare paint */
  #panel { height: 70px; flex: none; position: relative; background: url(../../../assets/paint.png) 0 0 / 80px 80px, #8c8e91; overflow: hidden;
    box-shadow: inset 0 -1px 0 rgba(0,0,0,.5); }
  #panel img { position: absolute; left: 0; top: 0; width: 1440px; height: 70px; }
  /* the field: `app::background`, a glow from the top and the dot grid */
  #field { flex: 1; position: relative; overflow: hidden; cursor: default;
    background: radial-gradient(circle 1px at 5.5px 5.5px, rgba(255,255,255,.021) 1px, transparent 1.2px) 0 0 / 11px 11px,
                radial-gradient(ellipse 120% 90% at 50% 30%, #2a2c2f, #151618 70%); }
  #console { position: absolute; left: 0; top: 0; }
  /* the status bar: `panel::status` */
  #status { height: 22px; flex: none; background: #0e0f10; border-top: 1px solid #000; display: flex; justify-content: space-between;
    font: 11.5px "Noto Sans Mono", monospace; line-height: 22px; padding: 0 14px; white-space: nowrap; overflow: hidden; }
  #status .l { color: #7d8085; }
  #status .r { color: #a8abae; }
  /* a card's PROFILE or PORT list: amber, as the panel's lists */
  .menu { position: fixed; z-index: 10; width: 360px; padding: 6px 0; border-radius: 6px; background: linear-gradient(#f7bb62, #e58f2c);
    box-shadow: 0 0 0 3px #111214, 0 10px 24px rgba(0,0,0,.6); font: bold 12px "Noto Sans", sans-serif; color: #3a2408; }
  .menu div { padding: 4px 14px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .menu div:hover { background: rgba(58,36,8,.12); }
  .menu div.cur::before { content: "▸ "; }
  .menu .hd { font-size: 9px; letter-spacing: 1.5px; opacity: .7; cursor: default; }
  .menu .hd:hover { background: none; }
</style>
</head>
<body>
<div id="panel"><img src="panel.png" alt=""></div>
<div id="field"><svg id="console" xmlns="http://www.w3.org/2000/svg"></svg></div>
<div id="status"><span class="l" id="sl">PipeWire 1.6.9 · 12 devices · 73 links · 18 cords</span><span class="r" id="sr">drag: scroll · wheel over a fader: volume · M: back · E: ENGINE</span></div>

<script>
"use strict";
// ---------- the code's measures (src/ui/mixer.rs) ----------
// HEAD: over the strip's frame (none: the frame is the module's edge); BAND: the frame's band,
// two lines on it (the device's name, the frame's)
const LEFT = 14, TOP = 26, GAP = 3, HEAD = 0, STRIP_W = 112, BAND = 38;
// GRAPH (#id, opens ENGINE): on the band's second line, at its right
const GRAPH_Y = 20, ROUTE_Y = BAND + 7, TRAVEL = 160, LEDS = 12, LED_W = 4;
// the modules are all as tall as the tallest (the most keys), not the window: the VOLUME (GAIN)
// block under the lowest key of any module, the faders (TAIL.faders high) or, when the window is
// too low for them, the rack's knobs (TAIL.knobs); lower still, the console scrolls
const TAIL = { faders: 228, knobs: 80 }, BOTTOM = 14;
let KEYS_Y = 200, CHAN_Y = 231, STRIP_H = 474, KNOBS = false;
// every group of keys has its title over it, the keys in rows from under it: as tall, as far apart
const ROW0 = 17, ROW = 23, KEY_H = 17;
const row = (i) => ROUTE_Y + ROW0 + i * ROW;
// a device's first row: MAIN (it is the default; lit) and ALL HERE (every app here, once), each in
// its own half
const halves = (x, w) => [[x, (w - 5) / 2], [x + (w + 5) / 2, (w - 5) / 2]];
// a device's keys under one title, SETUP: MAIN and ALL HERE in its first row, then its card's
// PROFILE, its PORT, each a small LCD with its name over it, the value in it at full width (a click
// opens the list)
const LCD_H = 16;
const mainRowY = () => row(0);
const setupItem = (i) => mainRowY() + KEY_H + 6 + i * 30;
const setupRow = (i) => setupItem(i) + 9;
const profileKey = (m) => [12, HEAD + setupRow(0), m.w - 24, LCD_H];
const setupN = (m) => (m.card ? 1 : 0) + (m.strips.some((s) => s.ports) ? 1 : 0);
let MOD_H = HEAD + STRIP_H;
const RADIUS = 8, VOL_MAX = 1.5;
// the modules' height: all as tall as the tallest (`need`: the lowest key's bottom on any module),
// the block right under it, never stretched to the window (no empty room); the faders while the
// window has room for them, else the knobs; lower still, the console scrolls
function stretch(need) {
  // (the block's name as far under the lowest key as a group's title under the keys over it)
  const keys = need + 27, room = Math.floor(field.clientHeight - TOP - BOTTOM - HEAD);
  KNOBS = room < keys + TAIL.faders;
  const tail = KNOBS ? TAIL.knobs : TAIL.faders;
  KEYS_Y = keys;
  CHAN_Y = KEYS_Y + 31;
  STRIP_H = KEYS_Y + tail;
  MOD_H = HEAD + STRIP_H;
}
// the lowest key's bottom on any module: an app's every PLAY ON (RECORD FROM) key, a device's
// MAIN keys and SETUP
function lowest(mods, ends) {
  const n = (role) => Math.max(ends.filter((e) => e.s.role === role).length, 1);
  let b = row(0) + KEY_H;
  for (const m of mods) {
    const setup = setupN(m);
    if (setup) b = Math.max(b, setupRow(setup - 1) + LCD_H);
    for (const s of m.strips) {
      if (s.role === "Play") b = Math.max(b, row(n("Sink") - 1) + KEY_H);
      if (s.role === "Rec") b = Math.max(b, row(n("Source") - 1) + KEY_H);
      if ((s.role === "Sink" || s.role === "Source") && s.vol !== null && s.nodeName) b = Math.max(b, mainRowY() + KEY_H);
    }
  }
  return b;
}
// the lettering (src/ui/print.rs)
const SECTION = { size: 9, spacing: 1.2 }, SMALL = { size: 7.5, spacing: 0.8 };
// the colours (face::kind_colour, band_ink, fin)
const KIND = { "SINK": "#007c7d", "SOURCE": "#206ea6", "PLAYBACK STREAM": "#7e5a42", "RECORDING STREAM": "#427935", "MIDI": "#934c7e", "VIDEO": "#876200", "DUPLEX": "#73348d" };
const kindColour = (k) => KIND[k] || "#cba553";
const bandInk = (k) => (kindColour(k) === "#cba553" ? "#1d1e20" : "#f3efe6");
const FIN = {
  alu: { base: "#8c8e91", paint: true, noise: 0, print: "#1d1e20" },
  black: { base: "#232427", paint: false, noise: 0.9, print: "#d5d7d9" },
  olive: { base: "#66683f", paint: false, noise: 0.7, print: "#f1f1e6" },
};

// ---------- the graph (the maintainer's, 2026-11-24) ----------
const CARDS = {
  jlab: { profile: 3, profiles: ["Off", "High Fidelity Playback (A2DP Sink, codec SBC)", "High Fidelity Playback (A2DP Sink, codec SBC-XQ)", "High Fidelity Playback (A2DP Sink, codec AAC)", "Headset Head Unit (HSP/HFP, codec CVSD)", "Headset Head Unit (HSP/HFP, codec mSBC)"] },
  radeon: { profile: 0, profiles: ["Off", "Digital Stereo (HDMI) Output", "Digital Stereo (HDMI 2) Output", "Digital Surround 5.1 (HDMI) Output", "Digital Surround 7.1 (HDMI) Output", "Pro Audio"] },
  ryzen: { profile: 1, profiles: ["Off", "Analog Stereo Duplex", "Analog Stereo Output", "Analog Surround 4.0 Output + Analog Stereo Input", "Analog Surround 4.0 Output", "Analog Stereo Input", "Pro Audio"] },
};
// devices and apps, as `Scene::devs` has them; a strip a group (`mixer::role_of`)
const DEVS = [
  { key: "jlab", name: "JLab GO Work 2", finish: "alu", card: "jlab", color: "#ec7a1c", strips: [
    { id: "phones", node: 95, role: "Sink", name: "HEADPHONES", kind: "SINK", vol: 0.5, mute: false, stereo: true, nodeName: "bluez_output", ports: null, sig: 0 },
    { id: "jmic", node: 197, role: "Source", name: "MIC", kind: "SOURCE", vol: 1, mute: false, stereo: false, nodeName: "bluez_input", ports: null, sig: 0.35 } ] },
  { key: "radeon", name: "Radeon High Definition Audio Controller", finish: "alu", card: "radeon", color: "#1752c8", strips: [] },
  { key: "ryzen", name: "Ryzen HD Audio Controller", finish: "alu", card: "ryzen", color: "#14965a", strips: [
    { id: "speakers", node: 50, role: "Sink", name: "SPEAKERS", kind: "SINK", vol: 0, mute: true, stereo: true, nodeName: "alsa_output", ports: ["Speakers", "Headphones"], port: 0, sig: 0 },
    { id: "rmic", node: 51, role: "Source", name: "BUILT-IN MIC", kind: "SOURCE", vol: 0.05, mute: true, stereo: true, nodeName: "alsa_input", ports: ["Internal Microphone", "Microphone"], port: 0, sig: 0.3 } ] },
  { key: "bitwig", name: "Bitwig Studio", finish: "black", app: true, strips: [
    { id: "bitwig", node: 491, role: "Play", name: "OUTPUT", kind: "DUPLEX", vol: null, stereo: false, cols: 2, to: ["eesink"], sig: 0.5, cue: true } ] },
  { key: "ee", name: "easyeffects", finish: "black", app: true, color: "#d4232a", strips: [
    { id: "eesink", node: 128, role: "Sink", name: "EASY EFFECTS SINK", kind: "SINK", vol: 1, mute: true, stereo: true, chans: true, nodeName: "easyeffects_sink", ports: null, sig: 0, feeds: "phones" },
    { id: "eefilter", node: 264, role: "Play", name: "EASY EFFECTS FILTER", kind: "NO CLASS", vol: null, stereo: false, cols: 2, to: [], sig: 0.8 } ] },
  { key: "fooyin", name: "fooyin", finish: "black", app: true, strips: [
    { id: "fooyin", node: 154, role: "Play", name: "OUTPUT", kind: "PLAYBACK STREAM", vol: 1, mute: false, stereo: true, to: ["phones"], sig: 0.9 } ] },
  { key: "hydrogen", name: "Hydrogen", finish: "black", app: true, strips: [
    { id: "hydrogen", node: 127, role: "Play", name: "OUTPUT", kind: "PLAYBACK STREAM", vol: 1, mute: false, stereo: true, to: ["eesink"], sig: 0 } ] },
  { key: "kadence", name: "kadence", finish: "black", app: true, strips: [
    { id: "kadence", node: 300, role: "Play", name: "OUTPUT", kind: "PLAYBACK STREAM", vol: 1, mute: false, stereo: true, to: ["eesink"], sig: 0 } ] },
  { key: "ocenaudio", name: "ocenaudio", finish: "black", app: true, strips: [
    { id: "ocenrec", node: 189, role: "Rec", name: "INPUT", kind: "RECORDING STREAM", vol: 1, mute: false, stereo: true, to: [], sig: 0 },
    { id: "ocenplay", node: 141, role: "Play", name: "OUTPUT", kind: "PLAYBACK STREAM", vol: 1, mute: false, stereo: true, to: ["eesink"], sig: 0 } ] },
  { key: "soundcraft", name: "soundcraft", finish: "black", app: true, strips: [
    { id: "soundcraft", node: 311, role: "Play", name: "OUTPUT", kind: "PLAYBACK STREAM", vol: 1, mute: false, stereo: true, to: ["eesink"], sig: 0 } ] },
];
let mainOut = "eesink", mainIn = "jmic";
const ALL = () => DEVS.flatMap((d) => d.strips.map((s) => Object.assign(s, { dev: d })));
const S = (id) => ALL().find((s) => s.id === id);
const takes = (s) => s.role === "Sink" || s.role === "Rec";

// ---------- text, as `print::Style` writes it ----------
const ctx = document.createElement("canvas").getContext("2d");
function width(st, t) {
  ctx.font = `bold ${st.size}px "Noto Sans"`;
  return ctx.measureText(t).width + st.spacing * [...t].length;
}
const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
function T(st, x, y, fill, anchor, t) {
  const shift = anchor === "middle" ? st.spacing / 2 : anchor === "end" ? st.spacing : 0;
  return `<text x="${x + shift}" y="${y}" font-size="${st.size}" letter-spacing="${st.spacing}" fill="${fill}" text-anchor="${anchor}">${esc(t)}</text>`;
}
function fit(t, st, w) {
  if (width(st, t) <= w) return t;
  let s = t;
  while (s && width(st, s + "…") > w) s = s.slice(0, -1);
  return s.trimEnd() + "…";
}
function inkOn(hex) {
  const lin = (c) => { c /= 255; return c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; };
  const [r, g, b] = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
  return 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b) > 0.3 ? "#111" : "#f3efe6";
}

// ---------- the faders (mixer.rs: cap_y, vol_at, channels, fader_x) ----------
const capY = (v) => 6 + (1 - Math.min(Math.max(v / VOL_MAX, 0), 1)) * TRAVEL;
function volAt(y) {
  const v = Math.min(Math.max((1 - (y - 6) / TRAVEL) * VOL_MAX, 0), VOL_MAX);
  return Math.abs(v - 1) < 0.03 ? 1 : v;
}
function channels(s) {
  const b = s.bal || 0, v = s.vol;
  return [b > 0 ? v * (1 - b) : v, b < 0 ? v * (1 + b) : v];
}
function setChannels(s, l, r) {
  // each channel to a whole per cent, the balance exactly from them (Scene::set_channels)
  [l, r] = [l, r].map((x) => Math.round(x * 100) / 100);
  const v = Math.max(l, r);
  s.vol = v;
  s.bal = v <= 0 || l === r ? 0 : l > r ? r / l - 1 : 1 - l / r;
}
const cols = (s) => s.cols || (s.stereo ? 2 : 1);
const chans = (s) => s.stereo && s.vol !== null && !!s.chans;

// ---------- the modules (mixer.rs: layout) ----------
let modules = [], hits = [], size = [0, 0], dividers = [];
// the gap between two groups (INPUTS, APPS, OUTPUTS), a groove down its middle
const SEP = 22;
// the console by what things do, as a hardware one (left to right):
//   INPUTS   the microphones (every source)
//   APPS     each program's OUTPUT and INPUT (an INPUT first), side by side
//   OUTPUTS  every sink, the default one too, and the cards that are off
// each A to Z, whatever is on or off, default or not: nothing jumps when it changes
// Every module is one strip, of one width: a device's input and output are apart (a headset's mic
// left, its headphones right), an app's too; each says whose it is on its heading. A card's PROFILE is once: on its output, else its input.
const SECTIONS = ["INPUTS", "APPS", "OUTPUTS"];
const byName = (a, b) => (a.name < b.name ? -1 : a.name > b.name ? 1 : 0);
function units() {
  const out = [];
  for (const d of DEVS) {
    d.strips.forEach((s) => { s.dev = d; });
    const name = d.name.toUpperCase();
    const ends = d.strips.filter((s) => s.role === "Sink" || s.role === "Source");
    const profileOn = d.card && (d.strips.find((s) => s.role === "Sink") || d.strips.find((s) => s.role === "Source"));
    for (const s of ends) {
      const sec = s.role === "Source" ? "INPUTS" : "OUTPUTS";
      out.push({ d, sec, name, strips: [s], card: s === profileOn ? d.card : null, first: 1 });
    }
    // an app's INPUT and OUTPUT apart too, the INPUT first: every module is one strip
    const apps = d.strips.filter((s) => s.role === "Play" || s.role === "Rec");
    [...apps.filter(takes), ...apps.filter((s) => !takes(s))].forEach((s, i) => out.push({ d, sec: "APPS", name, strips: [s], card: null, first: 1, n: i }));
    // a card that is off: its heading, among the outputs in its place by name
    if (!d.strips.length && d.card) out.push({ d, sec: "OUTPUTS", name, strips: [], card: d.card, first: 1 });
  }
  return out.sort((a, b) => (SECTIONS.indexOf(a.sec) - SECTIONS.indexOf(b.sec)) || (a.first - b.first) || byName(a, b) || ((a.n || 0) - (b.n || 0)));
}
function layout() {
  const mods = units();
  // an app's keys: every sink (source) shown, in the console's order
  const ends = mods.flatMap((m) => m.strips.filter((s) => (s.role === "Sink" || s.role === "Source") && s.vol !== null).map((s) => {
    const several = m.d.strips.filter((o) => o.role === s.role).length > 1;
    return { s, label: (several ? `${m.d.name} · ${s.name}` : m.d.name).toUpperCase(), color: m.d.color };
  }));
  stretch(lowest(mods, ends));
  hits = [];
  // one gap between every two modules
  let x = LEFT, was = null;
  dividers = [];
  for (const m of mods) {
    m.fin = FIN[m.d.finish];
    // between two groups: wider, a groove down the middle
    if (was && was !== m.sec) {
      dividers.push({ x: x - GAP + SEP / 2 });
      x += SEP - GAP;
    }
    was = m.sec;
    let at = 6;
    for (const s of m.strips) {
      s.x = at; s.w = STRIP_W; at += s.w;
      s.targets = s.role === "Play" ? ends.filter((e) => e.s.role === "Sink") : s.role === "Rec" ? ends.filter((e) => e.s.role === "Source") : [];
      s.main = s.id === mainOut || s.id === mainIn;
    }
    // a fixed width: one strip's, two strips', three…; a card that is off, one strip's
    m.w = Math.max(m.strips.length, 1) * STRIP_W + 12;
    m.x = x; x += m.w + GAP;
    const sy = TOP + HEAD;
    // a card's PROFILE: in its heading, the right half
    if (m.card) hits.push({ h: "profile", m, r: [m.x + profileKey(m)[0], TOP + profileKey(m)[1], profileKey(m)[2], profileKey(m)[3]] });
    for (const s of m.strips) {
      const x0 = m.x + s.x, gw = 10 + width(SMALL, `#${s.node}`), kx = x0 + 6, kw = s.w - 12;
      hits.push({ h: "graph", s, r: [x0 + s.w - 2 - gw, sy + GRAPH_Y, gw, 13] });
      const [hl, hr] = halves(kx, kw);
      if (s.role === "Play" || s.role === "Rec") {
        s.targets.forEach((t, i) => hits.push({ h: "to", s, t: t.s, r: [kx, sy + row(i), kw, KEY_H] }));
      } else {
        if (s.vol !== null && s.nodeName) {
          hits.push({ h: "main", s, r: [hl[0], sy + mainRowY(), hl[1], KEY_H] });
          hits.push({ h: "all", s, r: [hr[0], sy + mainRowY(), hr[1], KEY_H] });
        }
        if (s.ports) hits.push({ h: "port", s, m, r: [kx, sy + setupRow(m.card ? 1 : 0), kw, LCD_H] });
      }
      if (KNOBS) { knobHits(s, x0, sy); continue; }
      for (const [h, rr] of rowKeys(s, x0, sy)) hits.push({ h, s, r: rr });
      if (s.vol !== null) {
        slots(s).forEach((cx, i) => hits.push({ h: "fader", s, ch: chans(s) ? i : null, top: faderTop(sy), r: [x0 + cx - 17, faderTop(sy), 34, TRAVEL + 12] }));
      }
    }
  }
  size = [x - GAP + LEFT, TOP + MOD_H + BOTTOM];
  modules = mods;
}

// ---------- drawing (mixer.rs: module_svg, key, push_key, led_key, cap_svg, leds_svg) ----------
// ---------- the keys: the top panel's (panel::key_svg, led_svg) ----------
// a dark cap in a hole in the panel: the hole's rim catches the light at the bottom right, the cap
// casts a soft shadow into it and has a fine lit edge and a sheen. Pressed, it sinks a little into
// the hole and darkens (`deep`: held down, a little more)
function capKey(o, [x, y, w, h], pressed, deep) {
  const [cx, cy] = [x + w / 2, y + h / 2];
  o.push(`<rect x="${x - 3}" y="${y - 3}" width="${w + 6}" height="${h + 6}" rx="6" fill="url(#hole)" stroke="url(#edgeHole)" stroke-width="1.2"/>`);
  const sc = deep ? 0.94 : 0.955;
  const [tr, shadow, sheen] = pressed ? [` transform="translate(${cx * (1 - sc)},${cy * (1 - sc)}) scale(${sc})"`, 0.15 * 0.75, 0.35] : ["", 0.75, 1];
  o.push(`<g${tr}><rect x="${x + 0.2}" y="${y + 1.4}" width="${w + 2}" height="${h + 2}" rx="5" fill="#000" opacity="${shadow * 0.45}"/><rect x="${x + 1.2}" y="${y + 2.4}" width="${w}" height="${h}" rx="4" fill="#000" opacity="${shadow * 0.6}"/><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="url(#btnGrad)" stroke="#070708" stroke-width="1"/><g opacity="${sheen}"><rect x="${x + 0.8}" y="${y + 0.8}" width="${w - 1.6}" height="${h - 1.6}" rx="3.4" fill="none" stroke="url(#capEdge)" stroke-width="1.4"/><rect x="${x + 3}" y="${y + 1.6}" width="${w - 6}" height="${h * 0.4}" rx="2.5" fill="url(#capTop)"/></g>`);
  if (pressed) o.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="#000" opacity="${deep ? 0.3 : 0.2}"/>`);
  o.push("</g>");
}
// a key's LED, at its left: lit, a glow round it; off, dark in its colour
function led(o, cx, cy, on, color) {
  o.push(on ? `<circle cx="${cx}" cy="${cy}" r="5" fill="${color}" opacity=".35"/><circle cx="${cx}" cy="${cy}" r="2.6" fill="${color}"/>`
            : `<circle cx="${cx}" cy="${cy}" r="2.6" fill="#0a0a0b"/><circle cx="${cx}" cy="${cy}" r="2.6" fill="${color}" opacity=".2"/>`);
}
// a key that does something once (ALL HERE): no light, its name in the middle; down while held

  capKey(o, [x, y, w, h], isHeld, false);

  if (g.bal) hits.push({ h: "bal", s, r: [g.bal[0] - 15, g.bal[1] - 15, 30, 30] });
}
// a group's name (PLAY ON, SETUP, VOLUME...) in the middle of a rule from `x0` to `x1`: a thin line at its left and its right
function ruled(o, x0, x1, y, text, print) {
  const cx = (x0 + x1) / 2, half = width(SMALL, text) / 2 + 6, ly = y - 2.8;
  o.push(T(SMALL, cx, y, print, "middle", text));
  for (const [a, b] of [[x0, cx - half], [cx + half, x1]]) if (b - a > 2) o.push(`<path d="M${a},${ly} H${b}" stroke="${print}" stroke-opacity=".5"/>`);
}
function knob(o, x, y, r, a) {
  o.push(`<circle cx="${x}" cy="${y + 1.5}" r="${r + 0.5}" fill="#111" opacity=".5"/><circle cx="${x}" cy="${y}" r="${r}" fill="url(#gVol)" stroke="#0c0c0d"/><circle cx="${x}" cy="${y}" r="${r * 0.75}" fill="none" stroke="rgba(255,255,255,.08)"/><path d="M${polar(x, y, a, r * 0.29)} L${polar(x, y, a, r * 0.86)}" stroke="#ffb02e" stroke-width="${r > 12 ? 2.4 : 2}" stroke-linecap="round"/>`);
}
function knobs(o, s, x0, sy, print) {
  const g = knobGeo(s, x0, sy), cx0 = (x0 + 6 + g.mx - 5) / 2;
  ruled(o, x0 + 6, x0 + s.w - 6, g.t, blockName(s) + (g.bal ? " · BAL" : ""), print);
  for (const [h, r] of g.keys) {
    if (h === "cue") litKey(o, r, "CUE", "#5fd4ff", !!s.cue, false, holds("cue", s));
    // (no volume in PipeWire, nothing to mute: no MUTE key at all)
    else if (s.vol !== null) litKey(o, r, "MUTE", "#ff4a32", s.mute, false, holds("mute", s));
  }
  if (s.vol === null) {
    o.push(T(SMALL, cx0, g.t + 24, print, "middle", "NO VOLUME"));
    o.push(T(SMALL, cx0, g.t + 36, print, "middle", "IN PIPEWIRE"));
  } else {
    // VOLUME: silence to 150%, a long tick at 100% and red past it
    const [cx, cy] = g.vol;
    o.push(`<path d="M${polar(cx, cy, volAngle(1), 19.5)} A19.5,19.5 0 0 1 ${polar(cx, cy, volAngle(VOL_MAX), 19.5)}" fill="none" stroke="#d2402f" stroke-width="2.2" opacity=".85"/>`);
    for (let i = 0; i <= 12; i++) {
      const a = volAngle((i / 12) * VOL_MAX);
      o.push(`<path d="M${polar(cx, cy, a, 17.5)} L${polar(cx, cy, a, i % 4 === 0 ? 21 : 19.5)}" stroke="${print}" stroke-width=".9" opacity=".6"/>`);
    }
    o.push(`<path d="M${polar(cx, cy, volAngle(1), 16.5)} L${polar(cx, cy, volAngle(1), 23.5)}" stroke="${print}" stroke-width="1.6"/>`);
    knob(o, cx, cy, 14, volAngle(s.vol));
    // BAL: centre straight up with a long tick, L and R at the ends, the knob in its well
    if (g.bal) {
      const [bx, by] = g.bal, a = (s.bal || 0) * 135, st = holds("bal", s) ? "held" : s.balOut ? "out" : "in";
      for (let i = -4; i <= 4; i++) {
        const t = i * 33.75;
        o.push(`<path d="M${polar(bx, by, t, 11.5)} L${polar(bx, by, t, i === 0 ? 16 : 13.5)}" stroke="${print}" stroke-width="${i === 0 ? 1.5 : 0.9}" opacity="${i === 0 ? 1 : 0.6}"/>`);
      }
      o.push(`<circle cx="${bx}" cy="${by}" r="10.8" fill="url(#gHole)" stroke="rgba(255,255,255,.12)" stroke-width=".7"/>`);
      o.push(T(SMALL, bx - 12, by + 17, print, "middle", "L"), T(SMALL, bx + 12, by + 17, print, "middle", "R"));
      const pointer = (dy, c, w, r0, r1) => `<path d="M${polar(bx, by + dy, a, r0)} L${polar(bx, by + dy, a, r1)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
      if (st === "held") o.push(`<circle cx="${bx}" cy="${by + 0.6}" r="8.3" fill="#151618" stroke="#050506"/><circle cx="${bx}" cy="${by - 0.4}" r="8.6" fill="none" stroke="rgba(0,0,0,.7)" stroke-width="1.6"/>` + pointer(0.6, "#6a5028", 1.7, 2.4, 6.6));
      else if (st === "out") { o.push(`<circle cx="${bx + 1.6}" cy="${by + 3.2}" r="10.4" fill="#000" opacity=".55"/><circle cx="${bx}" cy="${by + 2}" r="9.6" fill="#0d0e0f"/>`); knob(o, bx, by, 9.6, a); }
      else o.push(`<circle cx="${bx}" cy="${by}" r="9" fill="#202124" stroke="#0c0c0d"/>` + pointer(0, "#8a6a32", 1.8, 2.6, 7.4));
    }
  }
  // the meter, under the name down to the keys' bottom
  // (under the block's name, its rule across the whole strip over it; its bottom level with the
  // keys' shadow)
  const my = g.t + 6, mh = 57 + KEY_H + 3 - 6, step = (mh - 4) / LEDS;
  o.push(`<rect x="${g.mx}" y="${my}" width="${g.mw}" height="${mh}" rx="3" fill="#0b0b0c"/>`);
  for (let c = 0; c < cols(s); c++) for (let i = 0; i < LEDS; i++) {
    const f = i / LEDS, dark = f >= 0.9 ? "#351612" : f >= 0.7 ? "#2f2810" : "#1c2a1f";
    o.push(`<rect class="led" data-s="${s.id}" data-c="${c}" data-i="${i}" data-dark="${dark}" fill="${dark}" x="${g.mx + 3 + c * (LED_W + 2)}" y="${my + mh - 1 - (i + 1) * step}" width="${LED_W}" height="${step - 2}" rx="1"/>`);
  }
}

function tick(ms) {
  const t = ms / 1000, lv = {};
  for (const s of ALL()) {
    const v = level(s, t).map((x) => (x <= 0 ? 0 : Math.max(0, Math.min(10, ((20 * Math.log10(x) + 54) / 54) * 10))));
    if (cols(s) === 1) v[1] = v[0];
    lv[s.id] = v;
  }
  for (const e of leds) {
    const count = LEDS, n = Math.round((lv[e.dataset.s][+e.dataset.c] || 0) * count / 10), i = +e.dataset.i, f = i / count;
    const on = i < n ? (f >= 0.9 ? "#ff3b2f" : f >= 0.7 ? "#ffb02e" : "#4cff6a") : e.dataset.dark;
    if (e.getAttribute("fill") !== on) e.setAttribute("fill", on);
  }
  requestAnimationFrame(tick);
}

// ---------- what the pointer does (mixer.rs: press, drag, wheel, hover) ----------
const at = (e) => { const b = field.getBoundingClientRect(); return [e.clientX - b.left + sx, e.clientY - b.top + sy]; };
const hitAt = ([x, y]) => hits.find(({ r }) => x >= r[0] && x <= r[0] + r[2] && y >= r[1] && y <= r[1] + r[3]);
const fname = (s) => `${s.dev.name} · ${s.name}`;
const sr = document.getElementById("sr");
function hover(h) {
  if (!h) return "drag: scroll · wheel over a fader: volume · R: rack · E: ENGINE";
  switch (h.h) {
    case "graph": return `#${h.s.node}: its block in ENGINE`;
    case "profile": return "The card's profile: which of its outputs and inputs it has";
    case "port": return "The card's port: where it plays or records from";
    case "to": { const l = h.s.to.includes(h.t.id); return `${fname(h.s)} ${l ? "goes to" : "doesn't go to"} ${fname(h.t)}. Click: ${l ? "not there any more" : "there too"}`; }
    case "main": return h.s.role === "Sink" ? `MAIN: make ${fname(h.s)} the default output: new apps play here` : `MAIN: make ${fname(h.s)} the default input: new apps record from here`;
    case "all": return h.s.role === "Source" ? `ALL HERE: every app records from ${fname(h.s)}, and it becomes the default` : `ALL HERE: every app plays on ${fname(h.s)}, and it becomes the default`;
    case "cue": return `Listen to ${fname(h.s)} in the default output; nothing else changes`;
    case "mute": return `Mute ${fname(h.s)}`;
    case "chan": return "SPLIT: a fader for L and one for R (JOIN: one for both)";
    case "fader": case "vol": return `${fname(h.s)}: drag or wheel; double-click 100%`;
    case "bal": return h.s.balOut ? "BAL: drag or wheel turns it; a click pushes it in" : "BAL: a click and it comes out, to turn";
  }
  return "";
}
// a fader to `v` (1 is 100%): the volume (the loudest channel; the other keeps its share), or one channel
function setFader(h, v) {
  if (h.ch === null) {
    const lr = channels(h.s), m = Math.max(...lr);
    if (!h.s.bal) h.s.vol = Math.round(v * 100) / 100;
    else setChannels(h.s, ...lr.map((x) => (m > 0 ? (x * v) / m : v)));
  } else {
    const lr = channels(h.s);
    lr[h.ch] = v;
    setChannels(h.s, lr[0], lr[1]);
  }
}
let drag = null, last = null, held = null;
// the key held down now, of a strip
const holds = (what, s) => !!held && held.h === what && held.s === s;
field.addEventListener("pointerdown", (e) => {
  closeMenu();
  const p = at(e), h = hitAt(p);
  field.setPointerCapture(e.pointerId);
  if (!h) { drag = { pan: [e.clientX, e.clientY, sx, sy] }; return; }
  const dbl = last && performance.now() - last.t < 350 && last.h.h === h.h && last.h.s === h.s && last.h.ch === h.ch;
  last = { t: performance.now(), h };
  switch (h.h) {
    case "graph": sr.textContent = `Opens ENGINE with #${h.s.node} chosen and in view`; return;
    case "profile": return openMenu(h, CARDS[h.m.card].profiles, CARDS[h.m.card].profile, (i) => { CARDS[h.m.card].profile = i; });
    case "port": return openMenu(h, h.s.ports, h.s.port, (i) => { h.s.port = i; });
    // a key with a LED goes down while held; let go over it, it stays in (or pops out)
    case "to": case "main": case "cue": case "mute": case "chan": held = h; break;
    case "all": {
      const want = h.s.role === "Sink" ? "Play" : "Rec";
      for (const a of ALL().filter((a) => a.role === want && a.to.length)) a.to = [h.s.id];
      if (h.s.role === "Sink") mainOut = h.s.id; else mainIn = h.s.id;
      break;
    }
    case "fader":
      if (dbl) setFader(h, 1); else { drag = { h }; setFader(h, volAt(p[1] - h.top)); }
      break;
    // a knob turns as the pointer goes up and down; double-click: 100%
    case "vol":
      if (dbl) h.s.vol = 1; else drag = { knob: h, y0: e.clientY, v0: h.s.vol };
      break;
    // BAL out: it turns, and a click without turning pushes it in; in: held down, out when let go
    case "bal":
      if (h.s.balOut) drag = { knob: h, y0: e.clientY, v0: h.s.bal || 0, moved: false };
      else held = h;
      break;
  }
  render();
});
field.addEventListener("pointermove", (e) => {
  if (drag && drag.pan) { sx = drag.pan[2] - (e.clientX - drag.pan[0]); sy = drag.pan[3] - (e.clientY - drag.pan[1]); clamp(); render(); return; }
  if (drag && drag.knob) {
    const s = drag.knob.s, d = drag.y0 - e.clientY;
    if (drag.knob.h === "vol") s.vol = Math.round(Math.min(Math.max(drag.v0 + d * 0.01, 0), VOL_MAX) * 100) / 100;
    else if (Math.abs(d) > 2 || drag.moved) { drag.moved = true; const b = Math.min(Math.max(drag.v0 + d / 100, -1), 1); s.bal = Math.abs(b) < 0.03 ? 0 : b; }
    render();
    return;
  }
  if (drag && drag.h) { setFader(drag.h, volAt(at(e)[1] - drag.h.top)); render(); sr.textContent = `${fname(drag.h.s)}: ${Math.round(drag.h.s.vol * 100)}%`; return; }
  const h = hitAt(at(e));
  sr.textContent = hover(h);
  field.style.cursor = h ? "pointer" : "default";
});
field.addEventListener("pointerup", (e) => {
  if (drag && drag.knob && drag.knob.h === "bal" && !drag.moved) { drag.knob.s.balOut = false; render(); }
  drag = null;
  if (held) {
    const h = hitAt(at(e));
    if (h && h.h === held.h && h.s === held.s && h.t === held.t) {
      const s = held.s;
      switch (h.h) {
        case "to": { const i = s.to.indexOf(h.t.id); if (i >= 0) s.to.splice(i, 1); else s.to.push(h.t.id); break; }
        case "main": if (s.role === "Sink") mainOut = s.id; else mainIn = s.id; break;
        case "cue": s.cue = !s.cue; break;
        case "mute": s.mute = !s.mute; break;
        case "chan": s.chans = !s.chans; break;
        case "bal": s.balOut = true; break;
      }
    }
    held = null;
    render();
  }
});
field.addEventListener("wheel", (e) => {
  e.preventDefault();
  const h = hitAt(at(e));
  if (h && (h.h === "vol" || (h.h === "bal" && h.s.balOut))) {
    const st = (e.deltaY < 0 ? 1 : -1) * (e.shiftKey ? 0.01 : 0.05);
    if (h.h === "vol") h.s.vol = Math.round(Math.min(Math.max(h.s.vol + st, 0), VOL_MAX) * 100) / 100;
    else h.s.bal = Math.min(Math.max((h.s.bal || 0) + st, -1), 1);
    render();
    return;
  }
  if (h && h.h === "fader") {
    const now = h.ch === null ? h.s.vol : channels(h.s)[h.ch];
    setFader(h, Math.min(Math.max(now + (e.deltaY < 0 ? 1 : -1) * (e.shiftKey ? 0.01 : 0.05), 0), VOL_MAX));
    render();
    return;
  }
  const wide = size[0] > field.clientWidth;
  if (wide && !e.deltaX && size[1] <= field.clientHeight) sx += e.deltaY; else { sx += e.deltaX; sy += e.deltaY; }
  clamp();
  render();
}, { passive: false });

// a card's list, under its key, as the app's (panel::profile_menu, port_menu)
let menu = null;
function closeMenu() { if (menu) { menu.remove(); menu = null; } }
function openMenu(h, items, cur, pick) {
  closeMenu();
  menu = document.createElement("div");
  menu.className = "menu";
  menu.innerHTML = `<div class="hd">${h.h === "profile" ? "PROFILE" : "PORT"}</div>` + items.map((t, i) => `<div class="${i === cur ? "cur" : ""}" data-i="${i}">${esc(t)}</div>`).join("");
  menu.onpointerdown = (e) => {
    e.stopPropagation();
    const d = e.target.closest("[data-i]");
    if (d) { pick(+d.dataset.i); render(); closeMenu(); }
  };
  document.body.appendChild(menu);
  const b = field.getBoundingClientRect();
  menu.style.left = Math.min(b.left + h.r[0] - sx, innerWidth - 366) + "px";
  menu.style.top = b.top + h.r[1] - sy + h.r[3] + 4 + "px";
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMenu(); });
addEventListener("resize", () => { clamp(); render(); });

document.fonts.load('bold 9px "Noto Sans"').then(() => { render(); requestAnimationFrame(tick); });
</script>
</body>
</html>
