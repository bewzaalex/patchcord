id: io.github.bewzaalex.patchcord
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  # libclang, for the bindings the pipewire crate generates from PipeWire's headers
  - org.freedesktop.Sdk.Extension.llvm21
command: patchcord
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # The GPU draws the panels and cords
  - --device=dri
  # The PipeWire graph: Patchcord lists, links and unlinks every node, and meters their signal
  - --filesystem=xdg-run/pipewire-0

modules:
  - name: patchcord
    buildsystem: simple
    build-options:
      # clang on the path too: bindgen asks it where its own C headers are
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm21/bin
      env:
        CARGO_HOME: /run/build/patchcord/cargo
        LIBCLANG_PATH: /usr/lib/sdk/llvm21/lib
    build-commands:
      - cargo --offline build --release --locked
      - install -Dm755 target/release/patchcord /app/bin/patchcord
      - install -Dm644 assets/io.github.bewzaalex.patchcord.desktop /app/share/applications/io.github.bewzaalex.patchcord.desktop
      - install -Dm644 assets/io.github.bewzaalex.patchcord.metainfo.xml /app/share/metainfo/io.github.bewzaalex.patchcord.metainfo.xml
      - install -Dm644 assets/icons/io.github.bewzaalex.patchcord.svg /app/share/icons/hicolor/scalable/apps/io.github.bewzaalex.patchcord.svg
    sources:
      # The checked-out source: in the release workflow that is the release tag
      - type: dir
        path: ../..
        skip:
          - .git
          - build
          - target
          - docs/research/pipewire/target
      - cargo-sources.json
