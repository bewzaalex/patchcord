xt x="511.4" y="96.0" font-family="Noto Sans" font-size="10.5" fill="#c9cbcd" text-anchor="start" xml:space="preserve">WirePlumber's own</text><text x="412.0" y="114.0" font-family="Noto Sans" font-size="8.5" fill="#e58f2c" font-weight="bold" text-anchor="start" letter-spacing="0.5" xml:space="preserve">PATCHCORD</text><text x="511.4" y="114.0" font-family="Noto Sans" font-size="10.5" fill="#c9cbcd" text-anchor="start" xml:space="preserve">ours: a meter, the cue</text><text x="412.0" y="132.0" font-family="Noto Sans" font-size="8.5" fill="#e58f2c" font-weight="bold" text-anchor="start" letter-spacing="0.5" xml:space="preserve">HIDDEN ON DESK</text><text x="511.4" y="132.0" font-family="Noto Sans" font-size="10.5" fill="#c9cbcd" text-anchor="start" xml:space="preserve">you hid it</text><text x="412.0" y="150.0" font-family="Noto Sans" font-size="8.5" fill="#ff6a52" font-weight="bold" text-anchor="start" letter-spacing="0.5" xml:space="preserve">44100→48000</text><text x="511.4" y="150.0" font-family="Noto Sans" font-size="10.5" fill="#c9cbcd" text-anchor="start" xml:space="preserve">resampled</text></svg>
